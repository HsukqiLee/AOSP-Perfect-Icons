name: Build Android Icon Pack

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x AndroidIconPack/gradlew

      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > AndroidIconPack/release.jks

      - name: Build debug and release APKs
        working-directory: AndroidIconPack
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease \
              -PICONPACK_STORE_FILE=release.jks \
              -PICONPACK_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
              -PICONPACK_KEY_ALIAS="$KEY_ALIAS" \
              -PICONPACK_KEY_PASSWORD="$KEY_PASSWORD" \
              --stacktrace
          else
            ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AOSPPerfectIcons-icon-pack-apk
          path: AndroidIconPack/app/build/outputs/apk/**/*.apk

      - name: Attach APK to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: AndroidIconPack/app/build/outputs/apk/**/*.apk
